name: diqqah_app
description: واجهة دِقَّة — Flutter واجهة واحدة لأندرويد وWindows (F-001)
# D-058 (تعليمة المالك «0.2.01.X»): الترقيم يواكب أرقام الوثائق وتحته رقم
# التجربة — 0: التطبيق دون النسخة الأولى، 2: جيل الوثائق، 01: طبعة الوثائق
# المعتمدة للمرحلة (v2.01) بخانتين، X: رقم التجربة (رقم تشغيل CI) فلا يتكرر
# أبداً. قواعد semver تمنع الصفر البادئ فتُحمَل هنا «0.2.1» والتبطين إلى
# «01» عند العرض حصراً (سطر الإعدادات، versionName أندرويد، أسماء حزم CI).
version: 0.2.1+3
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0
  path_provider: ^2.1.0
  sqlite3_flutter_libs: ^0.6.0
  # D-056 (إصلاح قيد أندرويد على مسار data): منتقي ملفات النظام (SAF) —
  # الاستعادة تختار الملف من أي مكان بدل كتابة مسار مخفي. إصدار مجرّب
  # مستقر (8.x) لا الأحدث التجريبي (13.x يشترط Flutter 3.38+).
  file_picker: ^8.1.0
  # D-056: إخراج النسخة من مجلد التطبيق المحجوب بنافذة المشاركة
  # (تنزيلات / Drive / رسالة لنفسه) — نفس القيد والقرار.
  share_plus: ^10.1.0
  diqqah_storage:
    path: ../storage
  diqqah_domain:
    path: ../domain

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
