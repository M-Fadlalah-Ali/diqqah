name: diqqah_app
description: واجهة دِقَّة — Flutter واجهة واحدة لأندرويد وWindows (F-001)
# D-213 (كلمة المالك 2026-11-21 «إعادة تسمية الإصدارات — b60 أول إصدار
# يتغير وينتقل ليصبح 0.260 دون الإضافات الأخرى»): الإصدار المعروض =
# «0.2» + رقم التشغيل N (60→0.260 و61→0.261) — بلا طبعة الوثائق وبلا
# لاحقة b. وsemver يُلزم ثلاثة مكونات فالترميز «0.N.0+run»: minor
# يحمل «2N» الملحومة (260 لتشغيل 60 و261 لتشغيل 61) وpatch مثبتة
# صفراً ببوابة بناء ترفض غيرها، وما بعد + هو versionCode للتثبيت
# المتصاعد بلا حذف. العرض والإسمية: APP_VERSION=0.261 (سقوط الصفر
# البخلي) وأسماء الأثرات diqqah-android-0.261 وdiqqah-windows-0.261 —
# وسطر الواجهة بالبادئة المُشعرة «v.» بكلمة المالك «أضف قبل رقم
# الإصدار ما يوحي بأنه رقم الإصدار v.0.260» فالعرض «دِقَّة v.0.261»
# والحقن التقني والكتالوج بالصيغة التقنية كما هي — وسطر كتالوج
# الإصدار backup_center.dart يوازي هذا السطر حرفاً (حارس ⑤ — علة س163).
# س204: 0.261.0+61 — إصدار الدفعة الثانية من M3 وإقفال م4 — محجوز
# لبناء b61 بأمر المالك حصراً بنمط س180/س186 (لا بناء بلا كلمته).
# س205: 0.262.0+62 — إصدار م06 التكيفي وبقية الرابعة من M3 (م07 و م10
# و م04 و م09) — محجوز لبناء b62 بأمر المالك حصراً بنمط الدفعات.
# س207: 0.263.0+63 — إصدار دفعة تنظيف ويندوز (بنود نقاش المالك المعتمد
# 2026-11-22: حفظ القوالب باسم بسطح المكتب وقائمة السياق الموحدة
# يمين/طويل بمصدر واحد وقواعد التلميح المركزية وتنظيف نصي السعر المكبر)
# — محجوز لبناء b63 بأمر المالك حصراً بنمط الدفعات.
# س208: 0.264.0+64 — إصدار الدفعة 2 «الاتساق» (نمط شاشة القائمة الموحد
# على السندات والأدوار والصناديق والمستودعات بقائمة التحقق الثمانية
# وم06 على الطلبات وملف اختبار المستودعات الأول بنص ملاحظة المالك)
# — محجوز لبناء b64 بأمر المالك حصراً بنمط الدفعات.
# س209: 0.265.0+65 — إصدار الدفعة 3 (قانون عرض سطح المكتب والرئيسية
# الست طبقات — بند 6 قواعد الصناعة بتفاصيل قرار المجلس س207: سلم
# المسافات 4/8 وشبكة أعمدة وبطاقة لا أيقونة بحد التوسيط ذاته وتباين
# AA حسابياً وطبقة نبض العمل من اللقطة القائمة والتذييل)
# — محجوز لبناء b65 بأمر المالك حصراً بنمط الدفعات.
# س210: 0.266.0+66 — إصدار الدفعة 4 (تعميم قانون العرض على بقية
# الشاشات بحاومته وهامشه الموثقين وانتقال أرشيف الفواتير للقاعدة
# الزمنية الموحدة مع بحث م11 له — بأمر المالك حرفاً)
# — محجوز لبناء b66 بأمر المالك حصراً بنمط الدفعات.
# س211: دفعة 1 من خطة الجلسة والمستخدمين (D-216: إنشاء المستخدمين
# بأقل امتياز وإلزام التغيير وشاشة المستخدمين) — محجوزة بناء b67
# بأمر المالك حصراً بنمط الدفعات.
# س212: 0.268.0+68 — دفعة 2 من خطة الجلسة والمستخدمين (D-215/U-005:
# آلة الحالتين وبوابة الجهاز ببلاطات المستخدمين والراية المحفوظة
# بapp_meta فلا ثقب عودة بعد موت العملية) — محجوز لبناء b68
# بأمر المالك حصراً بنمط الدفعات.
# س213: 0.269.0+69 حجزت لتشغيل 69 ففشل بعلّة بناء ويندوز الموثقة
# (local_auth_windows وSTL1011) فاحتل الرقم وسالخ بنمط الفجوات
# الموثق b45 — والترميز المنتِج تبع التشغيل القائم بD-213:
# س213: 0.270.0+70 — دفعة 3 من خطة الجلسة والمستخدمين (D-217 الخمول
# إعداد جهاز بالمستويات المغلقة والقفل الفوري عند المغادرة، والبيومتري
# للفتح السريع للمعلق فقط، وFLAG_SECURE قانوناً، وتنظيم الإعدادات
# D-218 بالخيار أ) — محجوز لبناء b70 بأمر المالك حصراً بنمط الدفعات.
# س215: 0.271.0+71 — البند 7 المعماري المعتمد «نواة واحدة قشرة
# لكل منصة» بأمر بدئه الملفظي (ووثيقته وحارسه البنيوي الآلي)،
# ومعالجة الثقل الجذري للبيانات الضخمة (ترحيلة v35: ستة عشر فهرساً
# لطرق الوصول الحارة التي كشفها اختبار القاعدة التجريبية الكبيرة
# س214) — محجوز لبناء b71 بأمر المالك حصراً بنمط الدفعات.
# س216 (أمر المالك «أريد الانتهاء من ثقل التطبيق أولاً وقائمة أسماء
# المستخدمين التي لا زالت موجودة ثانياً»): ①جذر ثقل الدقائق الأولى —
# المحرك بعزل خلفي createInBackground فلا حجب للعزل الواجهي بترحيلة
# v35 ولا VACUUM INTO ولا الفحص الافتتاحي، والنسخ لحاقاً خارج مسار
# الافتتاح بعد أول إطار ومهلة، وحساب البايتات (بصمة/تشفير) Isolate.run،
# وقراءة ترويسة اللقطة 64 بايتة لا الملف كله، وPRAGMA synchronous=NORMAL
# بالوضع اللوحي، ولسان الصدق على انتظار الافتتاح. ②بوابة الجهاز
# إدخالاً يدوياً بنقض بلاطات U-005 (لا تعداد أسماء) ورسالة فشل واحدة
# عامة عبر resumeSessionByLogin — محجوز لبناء b72 بأمر المالك حصراً.
# س218 (بكلمة المالك «عند تشغيل النسخة 0.272 ظهر هذا الخطأ … object is
# unsendable - _AsyncCompleter … ما معناه؟ وما دلالته؟ وما طريقة علاجه؟
# وما الأسباب التي أدّت لحدوثه؟»): إصلاح علة إرسال العزل الخلفي — إغلاق
# إعداد createInBackground المبني بنطاق المُصنعية كان يحمل سلسلة سياقه
# فسياق الأب يلتقط كائن القاعدة (عليه _AsyncCompleter لا يُرسَل) فرفض
# Dart رسالة الإقلاع قبل فتح الملف إطلاقاً — البناء كله ببنّاءتين
# علوية وإغلاق التشفير بنطاق علوي يلتقط المفتاح حصراً وحرس بنيوي
# باختبار s218 — والقاعدة قديمة الحزمة فلا مساس ببيانات — محجوز
# لبناء b73 بأمر المالك حصراً.
# س219 (بكلمة المالك «قمت بتثبيت 0.273 على الخليوي مع قاعدة البيانات
# الكبيرة… في شاشة الدخول استغرق الوقت من ضغط زر الدخول حتى ظهور رسالة
# بيانات الدخول غير صحيحة تقريباً 4.69 خلال 6 محاولات، هل هذا طبيعي؟»):
# التجزئة والتحقق بعزل الخلفية حصراً (hashInBackground و
# verifyStoredInBackground وequalizingWorkInBackground — 600,000 تكراراً
# بنوى دارت كانت تجمّد خيط الواجهة ~4.7 ثانية كل محاولة قريباً من عتبة
# ANR الإدخالية 5 ثوانٍ) وموازنةُ التوقيت بالرفض الثلاثة فلا قناة تعداد
# توقيتية ومؤشرُ جريان بالبوابة — محجوز لبناء b74 بأمر المالك حصراً.
# س221 (بأمر المالك «ابدأ بتنفيذ الدفعات الخمسة بالتسلسل الذي
# عرضته» — دفعة سرعة الدخول والنبض والقوائم): التنفيذ الأصلي للتجزئة
# (المؤجل س219 — قناة منصة PBKDF2-HMAC-SHA256 بمنفذ متسلسل جانب
# المنصة والتحقق الذاتي بمتجه معياري والبديل الخالص بعزل الخلفية
# بعقد س219 حرفاً — بنفس الـ600,000 تكراراً لا خفض أمني) واتساق
# نبض العمل (إزالة الشريط الأحمر وبطاقات النبض الثلاث بأوجهها
# الحقيقية وعلاج خطأ مسار المدخلات اليومية) وعزل النوع بجهة
# الأرشيف وحد العرض المتدرج للقوائم — محجوز لبناء b75 بأمر المالك
# حصراً.
# س223 (بأمر المالك «قم بتنفيذ المتبقي من د5 بالكامل ولا تنس
# الدفع والتوثيق والبناء 0.276» — دفعة إتمام قوائم المستندات): الحد
# المتدرج الموحد بنمط list_display.dart على بقية القوائم الموثقة —
# تبويبات السندات الثلاثة (عبر المساعد الموحد _tabList) وأرشيف
# الطلبات ومعاينات مستندات المخزون (الإذنان والتحويل والجرد — بدل
# السقف الصلب take(10) الذي كان يحجب الأقدم نهائياً) وأسطر كشف
# الحساب — القراءة كاملة لا مساس بها والحد بناء واجهة حصراً وزر
# التوسيع بعدّاد الباقي — محجوز لبناء b76 بأمر المالك حصراً.
version: 0.277.0+77
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # س-135/D-129 (دفعة 11): الاتجاه العربي الموحد — وفدو التوطين من
  # حزمة SDK الرسمية حصراً بلا حزمة خارجية (شرط بوابة الدفعة).
  flutter_localizations:
    sdk: flutter
  path: ^1.9.0
  path_provider: ^2.1.0
  # F-150/D-210 P0-ب (س148): خزنة مفتاح القاعدة على الجهاز — Keystore
  # أندرويد وDPAPI ويندوز. إصدار مجرّب مستقر من سلسلة 10.x لا الأحدث
  # التجريبي (نمط file_picker/mobile_scanner الموثق بالدفعة 10).
  flutter_secure_storage: ^10.3.0
  # D-056 (إصلاح قيد أندرويد على مسار data): منتقي ملفات النظام (SAF) —
  # الاستعادة تختار الملف من أي مكان بدل كتابة مسار مخفي. إصدار مجرّب
  # مستقر (8.x) لا الأحدث التجريبي (13.x يشترط Flutter 3.38+).
  file_picker: ^8.1.0
  # D-056: إخراج النسخة من مجلد التطبيق المحجوب بنافذة المشاركة
  # (تنزيلات / Drive / رسالة لنفسه) — نفس القيد والقرار.
  share_plus: ^10.1.0
  # D-016 (الطباعة والتصدير — دفعة إغلاق النواة س37): توليد PDF عربي
  # RTL بخط مضمّن من المكتبة المدمجة (D-104/D-212: ساحل وبلكس ونوتو
  # ووزيرمتن) ومقاسي A4/A5 — توليد المستند نقياً مختبراً،
  # والمشاركة بنافذة النظام عبر share_plus الجاهزة، والطباعة المباشرة
  # بحزمة printing تُغلف بلطف حيث لا تدعم المنصة.
  pdf: ^3.11.0
  printing: ^5.13.0
  # D-104 (دفعة 8 س39) / D-212 (س158): حفظ خيار الخط من المكتبة
  # المدمجة (أربع عائلات) — محميّة بالكامل ففشل المخزن في الاختبارات
  # يعيد الافتراضي بلا كسر، والمفتاح المحذوف tajawal يُرحّل إقلاعاً.
  shared_preferences: ^2.3.0
  # D-125 (دفعة 10 — بإذن بوابة الصور والباركود): الحزمان الخارجيتان
  # المتبقيتان في الواجهة — الالتقاط (image_picker) والمسح (mobile_scanner)
  # إصدار مجرّب مستقر 5.x لا الأحدث (نمط file_picker 8.x)، والضغط في
  # حزمة المجال النقية `image` (F-010) فلا حزمة ثالثة هنا.
  image_picker: ^1.1.2
  mobile_scanner: ^5.2.3
  # س213 (دفعة 3 من خطة الجلسة والمستخدمين): البيومتري للفتح السريع
  # للمعلق فقط (D-215/U-005) — BiometricPrompt بأندرويد حصراً
  # (FlutterFragmentActivity شرط الحزمة وصلاحية USE_BIOMETRIC)،
  # والويندوز بلا قناة أصلاً فالبوابة بلا زر بصة عنده — إصدار
  # مجرّب مستقر من سلسلة 2.x لا الأحدث التجريبي (نمط file_picker 8.x).
  local_auth: ^2.3.0
  diqqah_storage:
    path: ../storage
  diqqah_domain:
    path: ../domain

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # خطوط التطبيق المدمجة (D-104 دفعة 8 س39 — مُحدّثة بD-212 س158):
  # أربع عائلات مدمجة حصراً لا خطوط جهاز — ساحل الافتراضي والثلاثة
  # الآمنة طباعةً (IBM Plex Sans Arabic وNoto Sans Arabic وVazirmatn)
  # بلفظ المالك «أدرج الخطوط المتبقية»، وتجوال خرج بD-212 فحُذفت
  # أصوله ورخصته (خط بلا استعمال لا ميتات)، ورخص الخط الأربعة
  # (MIT ساحل وOFL 1.1 الثلاثة) مرفقة مع الأصول التزاماً بها،
  # والنسخ الثابتة Regular/Bold هي ذاتها المُدقّقة بايتياً بتقرير
  # «فحص الخطوط قبل التنفيذ v1.00» بجلسة س158.
  # الراكنان Rubik وReadex Pro لا أصول لهما هنا (09 §8).
  assets:
    - assets/brand/wordmark-header.png
    - assets/brand/wordmark-footer.png
    - assets/fonts/Sahel-Regular.ttf
    - assets/fonts/Sahel-Bold.ttf
    - assets/fonts/IBMPlexSansArabic-Regular.ttf
    - assets/fonts/IBMPlexSansArabic-Bold.ttf
    - assets/fonts/NotoSansArabic-Regular.ttf
    - assets/fonts/NotoSansArabic-Bold.ttf
    - assets/fonts/Vazirmatn-Regular.ttf
    - assets/fonts/Vazirmatn-Bold.ttf
    - assets/fonts/LICENSE-sahel.txt
    - assets/fonts/LICENSE-ibmplexsansarabic.txt
    - assets/fonts/LICENSE-notosansarabic.txt
    - assets/fonts/LICENSE-vazirmatn.txt

# F-150/D-210 P0 (س148): دمج SQLite3MultipleCiphers بدل sqlite3 العادي —
# توثيق drift 2.32+ الرسمي (hooks user_defines) حرفاً، ويُلغي حاجة
# sqlite3_flutter_libs (0.6.0+eol) المُنزوعة أعلاه. النمط المشفر المعتمد
# يُثبَّت وقت الفتح بPRAGMA cipher (د-٢ — kDbCipherScheme في الحزمة النقية)
# والمفتاح من خزنة الجهاز (د-٣). يعمل على كل منصات التطبيق بما فيها ويندوز.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
