name: diqqah_app
description: واجهة دِقَّة — Flutter واجهة واحدة لأندرويد وWindows (F-001)
# D-058 (تعليمة المالك «0.2.01.X»): الترقيم يواكب أرقام الوثائق وتحته رقم
# التجربة — 0: التطبيق دون النسخة الأولى، 2: جيل الوثائق، 01: طبعة الوثائق
# المعتمدة للمرحلة (v2.02) بخانتين، X: رقم التجربة (رقم تشغيل CI) فلا يتكرر
# أبداً. قواعد semver تمنع الصفر البادئ فتُحمَل هنا «0.2.2» والتبطين إلى
# «02» عند العرض حصراً (سطر الإعدادات، versionName أندرويد، أسماء حزم CI).
version: 0.2.2+14
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # س-135/D-129 (دفعة 11): الاتجاه العربي الموحد — وفدو التوطين من
  # حزمة SDK الرسمية حصراً بلا حزمة خارجية (شرط بوابة الدفعة).
  flutter_localizations:
    sdk: flutter
  path: ^1.9.0
  path_provider: ^2.1.0
  sqlite3_flutter_libs: ^0.6.0
  # D-056 (إصلاح قيد أندرويد على مسار data): منتقي ملفات النظام (SAF) —
  # الاستعادة تختار الملف من أي مكان بدل كتابة مسار مخفي. إصدار مجرّب
  # مستقر (8.x) لا الأحدث التجريبي (13.x يشترط Flutter 3.38+).
  file_picker: ^8.1.0
  # D-056: إخراج النسخة من مجلد التطبيق المحجوب بنافذة المشاركة
  # (تنزيلات / Drive / رسالة لنفسه) — نفس القيد والقرار.
  share_plus: ^10.1.0
  # D-016 (الطباعة والتصدير — دفعة إغلاق النواة س37): توليد PDF عربي
  # RTL بخط مضمّن من المكتبة المدمجة (D-104: ساحل/تجوال) ومقاسي A4/A5 — توليد المستند نقياً مختبراً،
  # والمشاركة بنافذة النظام عبر share_plus الجاهزة، والطباعة المباشرة
  # بحزمة printing تُغلف بلطف حيث لا تدعم المنصة.
  pdf: ^3.11.0
  printing: ^5.13.0
  # D-104 (دفعة 8 س39): حفظ خيار الخط (ساحل/تجوال) — محميّة بالكامل
  # ففشل المخزن في الاختبارات يعيد الافتراضي بلا كسر.
  shared_preferences: ^2.3.0
  # D-125 (دفعة 10 — بإذن بوابة الصور والباركود): الحزمان الخارجيتان
  # المتبقيتان في الواجهة — الالتقاط (image_picker) والمسح (mobile_scanner)
  # إصدار مجرّب مستقر 5.x لا الأحدث (نمط file_picker 8.x)، والضغط في
  # حزمة المجال النقية `image` (F-010) فلا حزمة ثالثة هنا.
  image_picker: ^1.1.2
  mobile_scanner: ^5.2.3
  diqqah_storage:
    path: ../storage
  diqqah_domain:
    path: ../domain

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # خطوط التطبيق المدمجة (D-104، دفعة 8 س39) — ساحل وتجوال حصراً بلفظ
  # المالك «احذف خط أميري من الخيارات، أبقِ فقط ساحل وتجوال» — والمكتبة
  # مدمجة حصراً لا خطوط جهاز، ورخصتا MIT/OFL مرفقتان مع الأصول، وأميري
  # خرج من الخيارات فحُذفت أصوله (خط بلا استعمال لا ميتات).
  assets:
    - assets/brand/wordmark-header.png
    - assets/brand/wordmark-footer.png
    - assets/fonts/Sahel-Regular.ttf
    - assets/fonts/Sahel-Bold.ttf
    - assets/fonts/Tajawal-Regular.ttf
    - assets/fonts/Tajawal-Bold.ttf
    - assets/fonts/LICENSE-sahel.txt
    - assets/fonts/LICENSE-tajawal.txt
