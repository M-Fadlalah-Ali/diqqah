# س227 (المرحلة صفر د1 من خارطة طريق التقرير الاستشاري — بأمر المالك
# «ابدأ التنفيذ»): تفعيل الفحص الأسلوبي المعلن — flutter_lints معلنة في
# dev_dependencies منذ التأسيس وبلا ملف تفعيل فالقواعد كلها كانت
# افتراضية صامتة (ثغرة معلنة الزيف: ساعة عمل).
#
# المعايرة («تثبيت مستوى التنبيهات») بجولة CI الحاكمة الأولى على فرع
# الاستطلاع (#462 — run 46032719198): 61 مخالفة معلومة أُصلح منها
# الميكانيكي (29: أقواس الاستيفاء 16 والسياق عبر فجوات async جزئياً
# لاحقاً والتبعية المصرَّحة والقوسان والاستيفاءان والحاويتان)،
# والمؤجل الموثق أدناه يُفعَّل تباعاً بدفعات التفكيك (د9) — فبوابةٌ
# تفشل هي الباب، والتعطيل بلا إثبات جولة غير جائز:
#   - no_leading_underscores_for_local_identifiers (17): معرِّف «__»
#     المتروك عرفَ إهمال الدارت — يحتاج تدقيقاً واحداً لكل موضع.
#   - constant_identifier_names + non_constant_identifier_names (2):
#     الموضع نفسه (كائن «__» بقائمة الرئيسية).
#   - use_build_context_synchronously (11): يتطلب مراجعة سياقات async
#     مركّبة — دفعة مستقلة مع فحص أقفال البناء، لا تصويباً أعمى.
#   - prefer_function_declarations_over_variables (3): مضيفو طباعة
#     السندات الثلاثة — مع دفعة تفكيك شاشة السندات.
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # س227 — معايرة موثقة بأعداد جولة #462 (التفعيل بدفعات التفكيك):
    no_leading_underscores_for_local_identifiers: false
    constant_identifier_names: false
    non_constant_identifier_names: false
    use_build_context_synchronously: false
    prefer_function_declarations_over_variables: false
