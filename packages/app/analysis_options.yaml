# س227 (المرحلة صفر د1 من خارطة طريق التقرير الاستشاري — بأمر المالك
# «ابدأ التنفيذ»): تفعيل الفحص الأسلوبي المعلن — flutter_lints معلنة في
# dev_dependencies منذ التأسيس وبلا ملف تفعيل فالقواعد كلها كانت
# افتراضية صامتة (ثغرة معلنة الزيف: ساعة عمل). البادئة include بالحزمة
# الرسمية كاملة، والمعايرة («تثبيت مستوى التنبيهات») بجولات CI الحاكمة
# على فرع الاستطلاع (القيد المؤسسي Task 37: لا SDK محلياً): ما ظهر من
# مخالفات القشرة الكبيرة يُعطَّل تعطيلاً موثقاً بعدّه هنا، ويُفعَّل
# تباعاً بدفعات التفكيك القادمة (د9 من خارطة الطريق) — فبواباتٌ لا
# تفشل ليست بوابات، ولا قاعدة تعطل بلا إثبات جولة.
include: package:flutter_lints/flutter.yaml
